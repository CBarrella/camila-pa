<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Camila's PA"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <title>Camila's PA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface2: #222;
      --border: #2a2a2a;
      --border-light: #333;
      --text: #f0ede8;
      --text-muted: #666;
      --text-dim: #444;
      --accent: #c8a96e;
      --red: #c0392b;
      --green: #27856a;
      --purple: #8e6bbf;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: 'Inter', sans-serif; color: var(--text); }

    #app {
      width: 100%; height: 100%;
      max-width: 520px; margin: 0 auto;
      display: flex; flex-direction: column;
      background: var(--bg);
      position: relative;
    }

    /* ── HEADER ── */
    #header {
      flex-shrink: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding-top: max(var(--safe-top), 44px);
      z-index: 20;
    }
    #header-inner {
      padding: 16px 20px 0;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    #header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 300; letter-spacing: 0.02em;
      color: var(--text); line-height: 1;
    }
    #header-title span { color: var(--accent); }
    #header-sub {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted); margin-top: 4px;
    }
    #header-badge {
      font-size: 10px; letter-spacing: 0.08em; color: var(--text-muted);
      border: 1px solid var(--border-light); border-radius: 20px;
      padding: 3px 10px; margin-bottom: 2px;
    }
    #tab-bar {
      display: flex; margin-top: 16px;
    }
    .tab-btn {
      flex: 1; background: none; border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted); padding: 10px 0;
      font-family: 'Inter', sans-serif;
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; font-weight: 400;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ── API SCREEN ── */
    #api-screen {
      flex: 1; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 32px; text-align: center; overflow-y: auto;
    }
    .api-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px; font-weight: 300; color: var(--accent);
      margin-bottom: 8px; letter-spacing: 0.04em;
    }
    #api-screen h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 300; color: var(--text);
      margin-bottom: 12px;
    }
    #api-screen p {
      font-size: 13px; color: var(--text-muted); line-height: 1.7;
      margin-bottom: 32px; max-width: 320px;
    }
    #api-screen a { color: var(--accent); text-decoration: none; }
    #api-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 8px; padding: 14px 16px; font-size: 13px;
      font-family: monospace; color: var(--text); outline: none;
      margin-bottom: 10px; transition: border-color 0.2s;
    }
    #api-input:focus { border-color: var(--accent); }
    #api-save-btn {
      width: 100%; background: var(--accent); color: #0f0f0f;
      border: none; border-radius: 8px; padding: 14px;
      font-size: 13px; font-family: 'Inter', sans-serif;
      font-weight: 500; cursor: pointer; letter-spacing: 0.06em;
      transition: opacity 0.2s;
    }
    #api-save-btn:active { opacity: 0.8; }

    /* ── VIEWS ── */
    .view { flex: 1; overflow-y: auto; display: none; overflow-x: hidden; }
    .view.active { display: flex; flex-direction: column; }
    .view::-webkit-scrollbar { display: none; }

    /* ── CHAT ── */
    #chat-view { padding: 20px 16px 140px; gap: 14px; }
    .msg-wrap { display: flex; flex-direction: column; animation: fadeUp 0.2s ease; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.assistant { align-items: flex-start; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    .msg-tag {
      font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 4px; padding: 0 4px; font-family: 'Inter', sans-serif;
    }
    .msg-bubble {
      border-radius: 16px; padding: 11px 15px; max-width: 84%;
      font-size: 14px; line-height: 1.55;
    }
    .msg-bubble.user {
      background: var(--surface2); color: var(--text);
      border-radius: 16px 16px 3px 16px;
      border: 1px solid var(--border-light);
    }
    .msg-bubble.assistant {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 3px;
    }
    .msg-time { font-size: 9px; color: var(--text-dim); margin-top: 4px; padding: 0 4px; }

    #typing { display: none; align-items: flex-start; }
    #typing.visible { display: flex; }
    .typing-bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px 16px 16px 3px; padding: 12px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--text-muted);
      animation: pulse 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100%{opacity:.2;transform:scale(.7)} 50%{opacity:1;transform:scale(1)} }

    /* ── TAG BAR ── */
    #tag-bar {
      position: fixed; bottom: 62px;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 520px;
      padding: 8px 14px;
      display: none; gap: 6px; overflow-x: auto;
      background: var(--bg); border-top: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    #tag-bar.visible { display: flex; }
    #tag-bar::-webkit-scrollbar { display: none; }
    .tag-chip {
      flex-shrink: 0; background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 20px; padding: 5px 11px; font-size: 11px;
      color: var(--text-muted); cursor: pointer;
      font-family: 'Inter', sans-serif; white-space: nowrap;
      transition: all 0.15s;
    }
    .tag-chip:active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }

    /* ── INPUT BAR ── */
    #input-bar {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 520px;
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 10px 14px;
      padding-bottom: max(calc(var(--safe-bottom) + 10px), 14px);
      display: none; gap: 10px; align-items: flex-end; z-index: 20;
    }
    #msg-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 20px; padding: 10px 16px;
      font-size: 14px; font-family: 'Inter', sans-serif;
      color: var(--text); resize: none; outline: none;
      line-height: 1.4; max-height: 100px; overflow-y: auto;
      transition: border-color 0.2s;
    }
    #msg-input:focus { border-color: var(--border-light); }
    #msg-input::placeholder { color: var(--text-dim); }
    #send-btn {
      background: var(--border); color: var(--text-dim); border: none;
      border-radius: 50%; width: 40px; height: 40px; font-size: 17px;
      cursor: default; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    #send-btn.ready { background: var(--accent); color: #0f0f0f; cursor: pointer; }

    /* ── DASHBOARD ── */
    #dashboard-view { padding: 20px 16px calc(var(--safe-bottom) + 24px); gap: 14px; }

    .date-label {
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-muted); font-family: 'Inter', sans-serif;
    }

    /* Today card */
    .today-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .today-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .today-card-label {
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .today-card-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 300; color: var(--text); line-height: 1.1;
    }
    .today-pill {
      background: var(--surface2); border: 1px solid var(--border-light);
      border-radius: 20px; padding: 4px 12px;
      font-size: 11px; color: var(--text-muted);
    }
    .today-stats { display: flex; gap: 20px; }
    .today-stat-item { display: flex; flex-direction: column; gap: 3px; }
    .today-stat-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
    .today-stat-val { font-size: 16px; font-family: 'Cormorant Garamond', serif; font-weight: 300; }
    .today-divider { height: 1px; background: var(--border); }
    .today-entries { display: flex; flex-direction: column; gap: 8px; }
    .today-entry-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .today-entry-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .today-entry-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .today-entry-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .today-entry-val { font-size: 12px; flex-shrink: 0; color: var(--text-muted); }
    .today-empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 8px 0; }

    /* Finance section */
    .fin-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .fin-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .fin-title { display: flex; align-items: center; gap: 8px; }
    .fin-title-icon { font-size: 12px; color: var(--accent); }
    .fin-title-text { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
    .fin-month-nav { display: flex; align-items: center; gap: 10px; }
    .fin-month-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; }
    .fin-month-label { font-size: 12px; color: var(--text); min-width: 60px; text-align: center; font-family: 'Inter', sans-serif; }
    .fin-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .fin-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fin-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .fin-card-label { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .fin-card-val { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 300; line-height: 1; }
    .fin-filter { display: flex; gap: 5px; overflow-x: auto; }
    .fin-filter::-webkit-scrollbar { display: none; }
    .fin-chip {
      flex-shrink: 0; background: transparent; border: 1px solid var(--border-light);
      border-radius: 20px; padding: 4px 10px; font-size: 10px;
      color: var(--text-muted); cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.15s; white-space: nowrap;
    }
    .fin-chip.active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }
    .fin-chart { display: flex; flex-direction: column; gap: 8px; }
    .fin-bar-row { display: flex; align-items: center; gap: 10px; }
    .fin-bar-label { font-size: 11px; color: var(--text-muted); width: 86px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fin-bar-track { flex: 1; background: var(--border); border-radius: 3px; height: 5px; overflow: hidden; }
    .fin-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); opacity: 0.7; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .fin-bar-val { font-size: 11px; color: var(--text-muted); width: 62px; text-align: right; flex-shrink: 0; }
    .fin-empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 12px 0; }

    /* Generic section */
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .section-header { padding: 14px 18px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .section-icon { font-size: 12px; }
    .section-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
    .entry-row { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
    .entry-row:last-child { border-bottom: none; }
    .entry-left { flex: 1; min-width: 0; }
    .entry-title { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-summary { font-size: 11px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-tag { font-size: 9px; letter-spacing: 0.1em; margin-top: 4px; }
    .entry-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
    .entry-value { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 300; line-height: 1.1; }
    .entry-date { font-size: 11px; color: var(--green); }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-dim); }
    .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
    .empty-text { font-size: 12px; line-height: 1.7; letter-spacing: 0.04em; }

    /* ── HISTORY ── */
    #history-view { padding: 20px 16px calc(var(--safe-bottom) + 24px); gap: 14px; }
    .filter-bar { display: flex; gap: 6px; overflow-x: auto; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; background: transparent; border: 1px solid var(--border-light);
      border-radius: 20px; padding: 6px 13px; font-size: 10px; letter-spacing: 0.08em;
      color: var(--text-muted); cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.15s; white-space: nowrap;
    }
    .filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .month-group-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 300; color: var(--text-muted);
      letter-spacing: 0.04em; padding: 8px 0 4px;
    }

    /* scrollbar */
    .view::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="header-inner">
      <div>
        <div id="header-title">Camila<span>'s</span> PA</div>
        <div id="header-sub">Personal Assistant</div>
      </div>
      <div id="header-badge" id="today-badge">—</div>
    </div>
    <div id="tab-bar">
      <button class="tab-btn active" onclick="switchView('chat')">Chat</button>
      <button class="tab-btn" onclick="switchView('dashboard')">Painel</button>
      <button class="tab-btn" onclick="switchView('history')">Histórico</button>
    </div>
  </div>

  <div id="api-screen">
    <div class="api-logo">C</div>
    <h2>Bem-vinda, Camila</h2>
    <p>Para ativar seu assistente, insira sua chave de API da Anthropic. Ela fica salva apenas no seu dispositivo.<br><br>
    Obtenha em <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys</p>
    <input type="password" id="api-input" placeholder="sk-ant-api03-..." autocomplete="off"/>
    <button id="api-save-btn" onclick="saveApiKey()">Ativar assistente →</button>
  </div>

  <div id="chat-view" class="view">
    <div id="typing">
      <div class="typing-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>

  <div id="dashboard-view" class="view"></div>
  <div id="history-view" class="view"></div>

  <div id="tag-bar"></div>

  <div id="input-bar">
    <textarea id="msg-input" rows="1"
      placeholder="#alimentação jantar 65 reais…"
      oninput="onInputChange(this)" onkeydown="onKeyDown(event)"></textarea>
    <button id="send-btn" onclick="send()">↑</button>
  </div>

</div>
<script>
const TAGS = {
  gasto:       { label:'Gastos',        icon:'↓', color:'#c0392b',  cats:['#alimentação','#transporte','#moradia','#saúde','#trabalho','#lazer','#compras','#educação','#beleza','#outros'] },
  credito:     { label:'Créditos',      icon:'↑', color:'#27856a',  cats:['#salário','#freelance','#investimento','#reembolso','#outros'] },
  compromisso: { label:'Compromissos',  icon:'◷', color:'#27856a',  cats:['#trabalho','#pessoal','#saúde','#financeiro','#outros'] },
  insight:     { label:'Insights',      icon:'◈', color:'#8e6bbf',  cats:['#trabalho','#mercado','#pessoal','#ideia','#aprendizado','#outros'] },
  nota:        { label:'Notas',         icon:'✎', color:'#c8a96e',  cats:['#trabalho','#pessoal','#lembrete','#pesquisa','#outros'] },
};

const UNIQUE_TAGS = [...new Set([
  '#alimentação','#transporte','#moradia','#saúde','#beleza','#lazer','#compras','#educação',
  '#salário','#freelance','#investimento','#reembolso',
  '#trabalho','#pessoal','#financeiro','#mercado','#ideia','#aprendizado','#lembrete','#pesquisa','#outros'
])];

const SYSTEM_PROMPT = `Você é um assistente pessoal chamado "Camila's PA". Processe a mensagem e retorne APENAS JSON válido sem nenhum texto adicional:
{
  "type": "gasto" ou "credito" ou "compromisso" ou "insight" ou "nota",
  "tag": "tag usada (#beleza etc) ou mais adequada se não informada",
  "title": "título curto máx 40 chars",
  "summary": "resumo em 1 linha",
  "value": número em reais ou null — OBRIGATÓRIO extrair quando mencionado (ex: "130 reais"→130, "R$45"→45, "cinquenta"→50),
  "date": "YYYY-MM-DD" ou null,
  "time": "HH:MM" ou null,
  "reply": "resposta breve e calorosa (1-2 frases)"
}
Tipos: gasto=despesa, credito=dinheiro recebido, compromisso=evento/reunião, insight=observação/aprendizado, nota=anotação.
Tags gastos: #alimentação #transporte #moradia #saúde #trabalho #lazer #compras #educação #beleza #outros
Tags créditos: #salário #freelance #investimento #reembolso #outros
IMPORTANTE: value NUNCA null para gastos/créditos se houver número na mensagem.`;

let messages = [], entries = [], apiKey = '';
let currentView = 'chat';
let histTypeFilter = 'todos', histTagFilter = 'todas';
const _n = new Date();
let finMonth = _n.getMonth(), finYear = _n.getFullYear(), finCatFilter = 'todas';

const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtTime = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtDate = d => { if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}`; };
const todayStr = () => new Date().toISOString().split('T')[0];
const monthName = m => ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m];
const todayFull = () => new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const saveEntries = () => localStorage.setItem('cpa_entries_v3', JSON.stringify(entries));

function init() {
  apiKey = localStorage.getItem('cpa_key') || '';
  const saved = localStorage.getItem('cpa_entries_v3')
    || localStorage.getItem('camila_pa_entries_v2');
  if (saved) entries = JSON.parse(saved);
  if (!apiKey) {
    document.getElementById('api-screen').style.display = 'flex';
  } else {
    startApp();
  }
}

function saveApiKey() {
  const val = document.getElementById('api-input').value.trim();
  if (!val.startsWith('sk-')) { alert('Chave inválida.'); return; }
  localStorage.setItem('cpa_key', val);
  apiKey = val;
  document.getElementById('api-screen').style.display = 'none';
  startApp();
}

function startApp() {
  if (!messages.length) messages.push({
    id:1, role:'assistant', ts:Date.now(),
    text:'Olá, Camila! Comece com uma tag antes de cada registro — #alimentação jantar 80 reais · #trabalho reunião sexta 14h · #ideia insight sobre clientes. Toque nas tags abaixo para inserir rapidamente.'
  });
  switchView('chat');
  document.getElementById('input-bar').style.display = 'flex';
  renderChat();
  renderTagBar();
  updateBadge();
}

function updateBadge() {
  const today = entries.filter(e => new Date(e.ts).toISOString().split('T')[0] === todayStr());
  document.getElementById('header-badge').textContent = today.length
    ? `${today.length} registro${today.length>1?'s':''} hoje`
    : 'nenhum registro hoje';
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['chat','dashboard','history'][i] === view);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view+'-view').classList.add('active');
  const tb = document.getElementById('tag-bar');
  const ib = document.getElementById('input-bar');
  if (view === 'chat') {
    ib.style.display = 'flex'; tb.classList.add('visible'); scrollBottom();
  } else {
    ib.style.display = 'none'; tb.classList.remove('visible');
    if (view === 'dashboard') renderDashboard();
    if (view === 'history') renderHistory();
  }
}

function renderTagBar() {
  document.getElementById('tag-bar').innerHTML =
    UNIQUE_TAGS.map(t => `<button class="tag-chip" onclick="insertTag('${t}')">${t}</button>`).join('');
}

function insertTag(tag) {
  const inp = document.getElementById('msg-input');
  inp.value = inp.value.startsWith('#') ? inp.value + ' ' + tag : tag + ' ' + inp.value;
  inp.focus(); onInputChange(inp);
}

function renderChat() {
  const c = document.getElementById('chat-view');
  const typing = document.getElementById('typing');
  c.innerHTML = ''; c.appendChild(typing);
  messages.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${msg.role}`;
    if (msg.tag) {
      const ti = msg.entryType ? TAGS[msg.entryType] : null;
      const lbl = document.createElement('div');
      lbl.className = 'msg-tag';
      lbl.style.color = ti ? ti.color : '#666';
      lbl.textContent = (ti ? ti.icon+' ' : '') + msg.tag;
      wrap.appendChild(lbl);
    }
    const b = document.createElement('div');
    b.className = `msg-bubble ${msg.role}`;
    b.textContent = msg.text;
    wrap.appendChild(b);
    const t = document.createElement('div');
    t.className = 'msg-time'; t.textContent = fmtTime(msg.ts);
    wrap.appendChild(t);
    c.insertBefore(wrap, typing);
  });
  scrollBottom();
}

function scrollBottom() {
  setTimeout(() => { const c=document.getElementById('chat-view'); c.scrollTop=c.scrollHeight; }, 60);
}

function onInputChange(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  document.getElementById('send-btn').classList.toggle('ready', el.value.trim().length > 0);
}

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

async function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').classList.remove('ready');
  messages.push({ id:Date.now(), role:'user', text, ts:Date.now() });
  renderChat();
  document.getElementById('typing').classList.add('visible');
  scrollBottom();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        system: SYSTEM_PROMPT,
        messages:[{role:'user', content:text}],
      }),
    });
    const data = await res.json();
    const raw = data.content?.find(b=>b.type==='text')?.text || '{}';
    const p = JSON.parse(raw.replace(/```json|```/g,'').trim());
    const entry = {
      id:Date.now(), type:p.type||'nota', tag:p.tag||'#outros',
      title:p.title||text.slice(0,40), summary:p.summary||text,
      value: typeof p.value === 'number' ? p.value : null,
      date:p.date||null, time:p.time||null, ts:Date.now(),
    };
    entries.push(entry); saveEntries(); updateBadge();
    messages.push({ id:Date.now()+1, role:'assistant', ts:Date.now(),
      text:p.reply||'Anotado.', tag:entry.tag, entryType:entry.type });
  } catch(e) {
    messages.push({ id:Date.now(), role:'assistant', text:'Erro ao processar. Tente novamente.', ts:Date.now() });
  }
  document.getElementById('typing').classList.remove('visible');
  renderChat();
}

// ── DASHBOARD ──
function renderDashboard() {
  const dash = document.getElementById('dashboard-view');
  dash.innerHTML = '';

  const todayAll = entries.filter(e => new Date(e.ts).toISOString().split('T')[0] === todayStr());
  const todayGasto = todayAll.filter(e=>e.type==='gasto').reduce((s,e)=>s+(e.value||0),0);
  const todayCredito = todayAll.filter(e=>e.type==='credito').reduce((s,e)=>s+(e.value||0),0);

  // Date label
  const dl = document.createElement('div'); dl.className = 'date-label';
  dl.textContent = todayFull().toUpperCase(); dash.appendChild(dl);

  // Today card
  const tc = document.createElement('div'); tc.className = 'today-card';
  const nowTime = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  let html = `
    <div class="today-card-top">
      <div>
        <div class="today-card-label">Resumo de hoje</div>
        <div class="today-card-date">${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</div>
      </div>
      <div class="today-pill">${nowTime}</div>
    </div>
    <div class="today-stats">
      <div class="today-stat-item">
        <div class="today-stat-label">Gastos</div>
        <div class="today-stat-val" style="color:${todayGasto>0?'#c0392b':'#666'}">${fmt(todayGasto)}</div>
      </div>
      ${todayCredito>0?`<div class="today-stat-item">
        <div class="today-stat-label">Créditos</div>
        <div class="today-stat-val" style="color:#27856a">${fmt(todayCredito)}</div>
      </div>`:''}
      <div class="today-stat-item">
        <div class="today-stat-label">Registros</div>
        <div class="today-stat-val" style="color:#c8a96e">${todayAll.length}</div>
      </div>
    </div>`;
  const recent = [...todayAll].reverse().slice(0,5);
  if (recent.length) {
    html += `<div class="today-divider"></div><div class="today-entries">`;
    recent.forEach(e => {
      const ti = TAGS[e.type];
      const meta = e.value ? fmt(e.value) : (e.time || e.tag);
      html += `<div class="today-entry-row">
        <div class="today-entry-info">
          <div class="today-entry-dot" style="background:${ti?.color||'#666'}"></div>
          <div class="today-entry-name">${e.title}</div>
        </div>
        <div class="today-entry-val">${meta}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="today-divider"></div><div class="today-empty">Nenhum registro hoje ainda</div>`;
  }
  tc.innerHTML = html; dash.appendChild(tc);

  // Finance
  const monthE = entries.filter(e => { const d=new Date(e.ts); return d.getMonth()===finMonth&&d.getFullYear()===finYear; });
  const gastoE = monthE.filter(e=>e.type==='gasto');
  const credE  = monthE.filter(e=>e.type==='credito');
  const totG = gastoE.reduce((s,e)=>s+(e.value||0),0);
  const totC = credE.reduce((s,e)=>s+(e.value||0),0);
  const saldo = totC - totG;
  const byTag = {};
  gastoE.forEach(e=>{ byTag[e.tag]=(byTag[e.tag]||0)+(e.value||0); });
  const maxV = Math.max(...Object.values(byTag), 1);
  const allTags = ['todas',...Object.keys(byTag)];

  const fs = document.createElement('div'); fs.className = 'fin-section';
  fs.innerHTML = `
    <div class="fin-header">
      <div class="fin-title">
        <span class="fin-title-icon">◈</span>
        <span class="fin-title-text">Finanças</span>
      </div>
      <div class="fin-month-nav">
        <button class="fin-month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="fin-month-label">${monthName(finMonth)}</div>
        <button class="fin-month-btn" onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="fin-body">
      <div class="fin-cards">
        <div class="fin-card">
          <div class="fin-card-label">Despesas</div>
          <div class="fin-card-val" style="color:#c0392b">${fmt(totG)}</div>
        </div>
        <div class="fin-card">
          <div class="fin-card-label">Créditos</div>
          <div class="fin-card-val" style="color:#27856a">${fmt(totC)}</div>
        </div>
        <div class="fin-card">
          <div class="fin-card-label">Saldo</div>
          <div class="fin-card-val" style="color:${saldo>=0?'#27856a':'#c0392b'}">${fmt(saldo)}</div>
        </div>
      </div>
      <div class="fin-filter">
        ${allTags.map(t=>`<button class="fin-chip ${finCatFilter===t?'active':''}" onclick="setFinCat('${t}')">${t}</button>`).join('')}
      </div>
      <div class="fin-chart">
        ${Object.entries(byTag)
          .filter(([t])=>finCatFilter==='todas'||t===finCatFilter)
          .sort((a,b)=>b[1]-a[1])
          .map(([tag,val])=>`
            <div class="fin-bar-row">
              <div class="fin-bar-label">${tag}</div>
              <div class="fin-bar-track"><div class="fin-bar-fill" style="width:${Math.round(val/maxV*100)}%"></div></div>
              <div class="fin-bar-val">${fmt(val)}</div>
            </div>`).join('')||`<div class="fin-empty">Sem gastos em ${monthName(finMonth)}</div>`}
      </div>
    </div>`;
  dash.appendChild(fs);

  // Compromissos
  const comps = entries.filter(e=>e.type==='compromisso'&&(e.date||'')>=todayStr())
    .sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);
  if (comps.length) dash.appendChild(buildSection('Próximos compromissos','◷','#27856a',comps));

  // Insights
  const ins = entries.filter(e=>e.type==='insight').slice(-3).reverse();
  if (ins.length) dash.appendChild(buildSection('Insights recentes','◈','#8e6bbf',ins));

  if (!entries.length) {
    dash.innerHTML += `<div class="empty-state"><div class="empty-icon">◌</div><div class="empty-text">Nenhum registro ainda.<br>Vá ao Chat e comece.</div></div>`;
  }
}

function changeMonth(d) {
  finMonth+=d;
  if(finMonth<0){finMonth=11;finYear--;} if(finMonth>11){finMonth=0;finYear++;}
  renderDashboard();
}
function setFinCat(c) { finCatFilter=c; renderDashboard(); }

function buildSection(title, icon, color, items) {
  const sec = document.createElement('div'); sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-icon" style="color:${color}">${icon}</span><span class="section-title">${title}</span></div>`;
  items.forEach(e => {
    const ti = TAGS[e.type];
    const row = document.createElement('div'); row.className = 'entry-row';
    let r = '';
    if (e.value) r = `<div class="entry-value" style="color:${e.type==='credito'?'#27856a':'#c0392b'}">${fmt(e.value)}</div>`;
    else if (e.date) r = `<div class="entry-date">${fmtDate(e.date)}${e.time?' · '+e.time:''}</div>`;
    row.innerHTML = `
      <div class="entry-left">
        <div class="entry-title">${e.title}</div>
        ${e.summary&&e.summary!==e.title?`<div class="entry-summary">${e.summary}</div>`:''}
        <div class="entry-tag" style="color:${ti?.color||'#666'}">${e.tag}</div>
      </div>
      <div class="entry-right">${r}</div>`;
    sec.appendChild(row);
  });
  return sec;
}

// ── HISTORY ──
function renderHistory() {
  const hist = document.getElementById('history-view');
  hist.innerHTML = '';

  const types = [['todos','Todos'],['gasto','Gastos'],['credito','Créditos'],['compromisso','Compromissos'],['insight','Insights'],['nota','Notas']];
  const tb = document.createElement('div'); tb.className = 'filter-bar';
  tb.innerHTML = types.map(([v,l])=>`<button class="filter-chip ${histTypeFilter===v?'active':''}" onclick="setHistType('${v}')">${l}</button>`).join('');
  hist.appendChild(tb);

  const availTags = [...new Set(
    (histTypeFilter==='todos' ? entries : entries.filter(e=>e.type===histTypeFilter)).map(e=>e.tag)
  )];
  if (availTags.length) {
    const tb2 = document.createElement('div'); tb2.className = 'filter-bar';
    tb2.innerHTML = ['todas',...availTags].map(t=>`<button class="filter-chip ${histTagFilter===t?'active':''}" onclick="setHistTag('${t}')">${t}</button>`).join('');
    hist.appendChild(tb2);
  }

  const filtered = entries.filter(e=>{
    return (histTypeFilter==='todos'||e.type===histTypeFilter) && (histTagFilter==='todas'||e.tag===histTagFilter);
  }).reverse();

  if (!filtered.length) {
    hist.innerHTML += `<div class="empty-state"><div class="empty-icon">◌</div><div class="empty-text">Nenhum registro encontrado.</div></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const d = new Date(e.ts);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!groups[key]) groups[key] = { label:`${monthName(d.getMonth())} ${d.getFullYear()}`, items:[] };
    groups[key].items.push(e);
  });

  Object.values(groups).forEach(g => {
    const gl = document.createElement('div');
    gl.className = 'month-group-label'; gl.textContent = g.label;
    hist.appendChild(gl);
    const sec = document.createElement('div'); sec.className = 'section';
    g.items.forEach(e => {
      const ti = TAGS[e.type];
      const row = document.createElement('div'); row.className = 'entry-row';
      let r = '';
      if (e.value) r = `<div class="entry-value" style="color:${e.type==='credito'?'#27856a':'#c0392b'}">${fmt(e.value)}</div>`;
      else if (e.date) r = `<div class="entry-date">${fmtDate(e.date)}${e.time?' · '+e.time:''}</div>`;
      else r = `<div style="font-size:12px;color:${ti?.color||'#666'}">${ti?.icon||''}</div>`;
      row.innerHTML = `
        <div class="entry-left">
          <div class="entry-title">${e.title}</div>
          ${e.summary&&e.summary!==e.title?`<div class="entry-summary">${e.summary}</div>`:''}
          <div class="entry-tag" style="color:${ti?.color||'#666'}">${ti?.icon||''} ${e.tag}</div>
        </div>
        <div class="entry-right">${r}</div>`;
      sec.appendChild(row);
    });
    hist.appendChild(sec);
  });
}

function setHistType(t) { histTypeFilter=t; histTagFilter='todas'; renderHistory(); }
function setHistTag(t) { histTagFilter=t; renderHistory(); }

init();
</script>
